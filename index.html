
<!DOCTYPE html>
<html>
<head>
<title>Product Listing</title>
<style>
body{font-family:Arial;text-align:center}
header,footer{background:#222;color:white;padding:15px}
.container{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;padding:20px}
.card{border:1px solid gray;padding:15px;text-align:center}
img{width:100px;height:80px}
button{background:orange;padding:8px}
@media(max-width:600px){
.container{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header>
<h2>My E-Commerce Store</h2>
<input placeholder="Search products">
</header>

<div class="container">
<div class="card">
<img src="mobile.jpeg" alt="Mobile">00
<h3>Mobile</h3>
<p>Price: ₹15000</p>
<button>Add to Cart</button>
</div>

<div class="card">
<img src="laptop0.jpeg"0 alt="Laptop">
<h3>Laptop</h3>
<p>Price: ₹50000</p>
<button>Add to Cart</button>
</div>
</div>

<footer>© My Store</footer>

</body>
</html>
